<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560" role="img" aria-labelledby="title desc">
  <title id="title">Claude persistent TUI execution after the change</title>
  <desc id="desc">A Claude-only controller keeps one PTY until idle, forwards raw terminal bytes, uses hooks for lifecycle, and uses transcript only for final text and usage.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#334155"/></marker></defs>
  <rect width="1160" height="560" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#172033">
    <text x="42" y="44" font-size="24" font-weight="700">After · Claude-only persistent TUI</text>
    <text x="42" y="72" font-size="14" fill="#64748b">Codex, Kimi and Pi stay on their current provider paths.</text>
    <rect x="42" y="176" width="170" height="90" rx="10" fill="#e0e7ff" stroke="#4f46e5"/><text x="72" y="211" font-size="16">Local runtime</text><text x="58" y="238" font-size="13" fill="#475569">human turn / canonical S</text>
    <rect x="300" y="145" width="210" height="150" rx="10" fill="#fff" stroke="#334155"/><text x="333" y="182" font-size="17">Claude TUI controller</text><text x="325" y="210" font-size="13" fill="#475569">single generation + idle</text><text x="322" y="235" font-size="13" fill="#475569">per-turn capability lease</text><text x="329" y="260" font-size="13" fill="#475569">interactive / resume S</text>
    <rect x="606" y="145" width="175" height="150" rx="10" fill="#fff" stroke="#334155"/><text x="656" y="183" font-size="17">PTY</text><text x="632" y="212" font-size="13" fill="#475569">stdin: human input</text><text x="629" y="237" font-size="13" fill="#475569">stdout: raw bytes</text><text x="626" y="262" font-size="13" fill="#475569">Claude Code TUI</text>
    <rect x="896" y="145" width="205" height="150" rx="10" fill="#ecfdf5" stroke="#059669"/><text x="929" y="183" font-size="17">Read-only terminal</text><text x="926" y="212" font-size="13" fill="#475569">ordered byte trace</text><text x="924" y="237" font-size="13" fill="#475569">no Markdown / input</text>
    <rect x="348" y="376" width="194" height="108" rx="10" fill="#fff7ed" stroke="#d97706"/><text x="380" y="413" font-size="17">Lifecycle hooks</text><text x="373" y="441" font-size="13" fill="#475569">private loopback only</text><text x="376" y="464" font-size="13" fill="#475569">Stop / SessionEnd</text>
    <rect x="678" y="376" width="214" height="108" rx="10" fill="#fff" stroke="#334155"/><text x="711" y="413" font-size="17">Transcript resolver</text><text x="710" y="441" font-size="13" fill="#475569">final text + usage only</text><text x="720" y="464" font-size="13" fill="#475569">exact session S</text>
    <path d="M212 221H284" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M510 221H590" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M781 221H880" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M694 295V355H542" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M542 430H662" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="347" y="526" font-size="14" fill="#475569">Only after lifecycle Stop does the resolver publish the normal Agent result.</text>
  </g>
</svg>
