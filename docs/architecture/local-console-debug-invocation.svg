<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600">
  <rect width="1120" height="600" fill="#ffffff"/>
  <style>
    text { font-family: Arial, sans-serif; font-size: 15px; fill: #1f2937; }
    .title { font-size: 20px; font-weight: 700; }
    .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 8; }
    .accent { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.8; rx: 8; }
    .success { fill: #ecfdf5; stroke: #059669; stroke-width: 1.8; rx: 8; }
    .muted { fill: #64748b; font-size: 13px; }
    .line { stroke: #475569; stroke-width: 1.8; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
  <text x="36" y="42" class="title">After · per-attempt debug call chain</text>
  <text x="36" y="68" class="muted">Module directions unchanged; rollout read branches into paged events and lazy invocation metadata</text>

  <rect x="40" y="115" width="210" height="115" class="box"/>
  <text x="64" y="150">Codex rollout JSONL</text>
  <text x="64" y="178" class="muted">actual prompt stack</text>
  <text x="64" y="202" class="muted">model + raw events</text>

  <rect x="315" y="115" width="230" height="115" class="box"/>
  <text x="339" y="150">Trusted rollout resolver</text>
  <text x="339" y="178" class="muted">run → thread → unique file</text>
  <text x="339" y="202" class="muted">root / inode validation</text>
  <line x1="250" y1="172" x2="315" y2="172" class="line"/>

  <rect x="610" y="90" width="235" height="125" class="accent"/>
  <text x="634" y="126">Debug event projector</text>
  <text x="634" y="154" class="muted">type / time / call id</text>
  <text x="634" y="178" class="muted">unredacted input / output</text>
  <text x="634" y="202" class="muted">token visible · reasoning filtered</text>
  <line x1="545" y1="150" x2="610" y2="150" class="line"/>

  <rect x="610" y="250" width="235" height="125" class="success"/>
  <text x="634" y="286">Invocation reader</text>
  <text x="634" y="314" class="muted">SYSTEM / DEVELOPER / USER</text>
  <text x="634" y="338" class="muted">model / effort / provider / CLI</text>
  <text x="634" y="362" class="muted">lazy, bounded, per attempt</text>
  <line x1="545" y1="190" x2="580" y2="190" class="line"/>
  <line x1="580" y1="190" x2="580" y2="312" class="line"/>
  <line x1="580" y1="312" x2="610" y2="312" class="line"/>

  <rect x="910" y="145" width="170" height="180" class="box"/>
  <text x="934" y="180">Local process APIs</text>
  <text x="934" y="208" class="muted">events: page + append</text>
  <text x="934" y="236" class="muted">invocation: lazy read</text>
  <text x="934" y="264" class="muted">stable error codes</text>
  <text x="934" y="292" class="muted">no rollout copy</text>
  <line x1="845" y1="150" x2="910" y2="190" class="line"/>
  <line x1="845" y1="312" x2="910" y2="280" class="line"/>

  <rect x="610" y="445" width="235" height="110" class="box"/>
  <text x="634" y="480">Desktop async adapter</text>
  <text x="634" y="508" class="muted">Abort + run-key isolation</text>
  <text x="634" y="532" class="muted">paged events + lazy prompt cache</text>
  <line x1="995" y1="325" x2="995" y2="405" class="line"/>
  <line x1="995" y1="405" x2="728" y2="405" class="line"/>
  <line x1="728" y1="405" x2="728" y2="445" class="line"/>

  <rect x="315" y="445" width="230" height="110" class="accent"/>
  <text x="339" y="480">ProcessTab debug UI</text>
  <text x="339" y="508" class="muted">attempt metadata + disclosures</text>
  <text x="339" y="532" class="muted">virtual raw event timeline</text>
  <line x1="610" y1="500" x2="545" y2="500" class="line"/>

  <rect x="40" y="445" width="210" height="110" class="box"/>
  <text x="64" y="480">Session facts</text>
  <text x="64" y="508" class="muted">thread link + run status</text>
  <text x="64" y="532" class="muted">immutable profile fallback</text>
  <line x1="250" y1="500" x2="315" y2="500" class="line"/>
</svg>
