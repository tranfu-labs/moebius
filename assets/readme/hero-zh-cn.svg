<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="720" viewBox="0 0 1200 720"
     role="img" aria-labelledby="title desc">
  <title id="title">Moebius — 一个目标，一支团队，全程可见</title>
  <desc id="desc">Moebius 品牌与真实产品截图组成的首屏，展示本地操作台中的多 Agent 会话和可见代码改动。</desc>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5E6AD2"/>
      <stop offset="1" stop-color="#C090FF"/>
    </linearGradient>
    <linearGradient id="screen-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".18"/>
    </linearGradient>
    <clipPath id="screen-clip">
      <rect x="56" y="252" width="1088" height="408" rx="0"/>
    </clipPath>
  </defs>

  <rect width="1200" height="720" fill="#101010"/>
  <rect x="1" y="1" width="1198" height="718" rx="27" fill="none" stroke="#2A2A2A" stroke-width="2"/>

  <g id="brand" transform="translate(56 48)">
    <image width="72" height="72"
           href="../brand/generated/ui-icon-64.png"
           preserveAspectRatio="xMidYMid meet"/>
    <text x="92" y="59" fill="#F4F4F4" font-size="64" font-weight="760"
          letter-spacing="-3"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">MOEBIUS</text>
    <rect x="94" y="75" width="92" height="6" rx="3" fill="url(#accent)"/>
  </g>

  <text x="56" y="174" fill="#F4F4F4" font-size="30" font-weight="650"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    一个目标，一支团队，每一次交棒全程可见。
  </text>

  <g transform="translate(832 58)" data-container="true">
    <rect width="312" height="42" rx="21" fill="#191C32" stroke="#434B9D"/>
    <circle cx="22" cy="21" r="5" fill="#C090FF"/>
    <text x="38" y="28" fill="#D4D4DC" font-size="18" font-weight="700"
          letter-spacing=".4"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">真实产品界面 · macOS</text>
  </g>
  <text x="1144" y="148" text-anchor="end" fill="#8B8B94" font-size="18" font-weight="650"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">本地操作台 · APPLE SILICON</text>

  <g id="product-proof">
    <rect x="58" y="218" width="1096" height="464" rx="20" fill="#000000" opacity=".42"/>
    <rect x="48" y="208" width="1104" height="468" rx="20" fill="#191919" stroke="#4A4A4A" stroke-width="2"/>
    <rect x="50" y="210" width="1100" height="464" rx="18" fill="none" stroke="#242424"/>
    <path d="M48 252H1152" stroke="#303030" stroke-width="2"/>
    <circle cx="76" cy="230" r="7" fill="#FF5F57"/>
    <circle cx="98" cy="230" r="7" fill="#FEBC2E"/>
    <circle cx="120" cy="230" r="7" fill="#28C840"/>
    <text x="144" y="237" fill="#8B8B94" font-size="18" font-weight="650"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">Moebius · 本地操作台</text>

    <image x="56" y="252" width="1088" height="408"
           href="../../sites/marketeam/assets/preview-center.png"
           preserveAspectRatio="xMidYMid slice"
           clip-path="url(#screen-clip)"/>
    <rect x="56" y="252" width="1088" height="408" fill="url(#screen-shade)"
          clip-path="url(#screen-clip)" pointer-events="none"/>
  </g>
</svg>
