<svg xmlns="http://www.w3.org/2000/svg"
     width="1400" height="620" viewBox="0 0 1400 620"
     role="img" aria-labelledby="title desc">
  <title id="title">Moebius Agent 团队协作闭环</title>
  <desc id="desc">用户把目标交给 Leader Agent，Leader Agent 动态派工给专业成员；成员在团队内交棒、复核和返工，再把证据与结果交回 Leader Agent，由 Leader Agent 向用户询问关键裁决或完成收口。</desc>

  <defs>
    <marker id="arrow-purple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0L10 4L0 8Z" fill="#C090FF"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0L10 4L0 8Z" fill="#4ADE80"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .primary { fill: #F4F4F4; }
      .secondary { fill: #A1A1AA; }
      .muted { fill: #71717A; }
      .node-title { font-size: 22px; font-weight: 680; }
      .node-copy { font-size: 15px; font-weight: 480; }
      .label { font-size: 15px; font-weight: 620; }
    </style>
  </defs>

  <rect width="1400" height="620" fill="#101010"/>
  <rect x="1" y="1" width="1398" height="618" fill="none" stroke="#2A2A2A" stroke-width="2"/>

  <text x="64" y="58" class="sans primary" font-size="26" font-weight="700">一个目标，穿过整支团队，再带着结果回来</text>
  <text x="1336" y="56" text-anchor="end" class="mono secondary" font-size="14" font-weight="600" letter-spacing="0.8">动态协作闭环</text>
  <path d="M64 90H1336" stroke="#2A2A2A" stroke-width="2"/>

  <!-- Main collaboration rails -->
  <path d="M284 250H400" fill="none" stroke="#C090FF" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <path d="M760 250H860" fill="none" stroke="#C090FF" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <path d="M860 380H760" fill="none" stroke="#4ADE80" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M400 380H284" fill="none" stroke="#4ADE80" stroke-width="3" marker-end="url(#arrow-green)"/>

  <!-- Arrow labels with opaque backgrounds -->
  <g class="sans label">
    <rect x="303" y="215" width="78" height="30" rx="15" fill="#101010" stroke="#4A3566"/>
    <text x="342" y="236" text-anchor="middle" fill="#D8B4FE">提出目标</text>

    <rect x="766" y="215" width="88" height="30" rx="15" fill="#101010" stroke="#4A3566"/>
    <text x="810" y="236" text-anchor="middle" fill="#D8B4FE">判断派工</text>

    <rect x="766" y="388" width="88" height="30" rx="15" fill="#101010" stroke="#24583A"/>
    <text x="810" y="409" text-anchor="middle" fill="#86EFAC">证据结果</text>

    <rect x="301" y="388" width="82" height="30" rx="15" fill="#101010" stroke="#24583A"/>
    <text x="342" y="409" text-anchor="middle" fill="#86EFAC">可见收口</text>
  </g>

  <!-- User -->
  <g id="user">
    <rect x="64" y="180" width="220" height="240" rx="18" fill="#141821" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="174" cy="226" r="18" fill="none" stroke="#60A5FA" stroke-width="3"/>
    <path d="M140 274C146 248 202 248 208 274" fill="none" stroke="#60A5FA" stroke-width="3" stroke-linecap="round"/>
    <text x="174" y="315" text-anchor="middle" class="sans primary node-title">你</text>
    <path d="M96 334H252" stroke="#283447"/>
    <text x="174" y="365" text-anchor="middle" class="sans secondary node-copy">说清目标</text>
    <text x="174" y="394" text-anchor="middle" class="sans secondary node-copy">处理关键裁决</text>
  </g>

  <!-- Leader Agent -->
  <g id="leader-agent">
    <rect x="400" y="140" width="360" height="340" rx="22" fill="#181528" stroke="#C090FF" stroke-width="3"/>
    <rect x="408" y="148" width="344" height="324" rx="16" fill="none" stroke="#5E6AD2" stroke-width="1.5"/>

    <path d="M530 194C544 174 562 174 576 194C590 214 608 214 622 194C608 174 590 174 576 194C562 214 544 214 530 194Z"
          fill="none" stroke="#C090FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="580" y="240" text-anchor="middle" class="sans primary" font-size="25" font-weight="700">Leader Agent</text>
    <text x="580" y="269" text-anchor="middle" class="mono" fill="#C4B5FD" font-size="14" font-weight="600">团队主理人</text>
    <path d="M448 291H712" stroke="#403552"/>

    <circle cx="468" cy="326" r="5" fill="#C090FF"/>
    <text x="488" y="333" class="sans secondary node-copy">判断下一步</text>
    <circle cx="468" cy="370" r="5" fill="#C090FF"/>
    <text x="488" y="377" class="sans secondary node-copy">组织团队交棒</text>
    <circle cx="468" cy="414" r="5" fill="#4ADE80"/>
    <text x="488" y="421" class="sans secondary node-copy">依据证据继续或收口</text>
  </g>

  <!-- Agent team container -->
  <g id="agent-team">
    <rect x="860" y="105" width="476" height="440" rx="20" fill="#11151D" stroke="#3F3F46" stroke-width="2"/>
    <text x="900" y="150" class="sans primary" font-size="23" font-weight="700">Agent 团队</text>
    <text x="1296" y="149" text-anchor="end" class="sans secondary" font-size="14">角色由自然语言定义</text>

    <!-- Internal handoff rails -->
    <path d="M1060 250V285" fill="none" stroke="#C090FF" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
    <path d="M1060 355V390" fill="none" stroke="#C090FF" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
    <path d="M1200 425H1280V215H1200" fill="none" stroke="#C090FF" stroke-width="2.5" marker-end="url(#arrow-purple)"/>

    <rect x="1070" y="254" width="64" height="28" rx="14" fill="#11151D" stroke="#4A3566"/>
    <text x="1102" y="274" text-anchor="middle" class="sans" fill="#D8B4FE" font-size="14" font-weight="620">交棒</text>
    <rect x="1070" y="359" width="64" height="28" rx="14" fill="#11151D" stroke="#4A3566"/>
    <text x="1102" y="379" text-anchor="middle" class="sans" fill="#D8B4FE" font-size="14" font-weight="620">交棒</text>
    <rect x="1228" y="306" width="76" height="30" rx="15" fill="#11151D" stroke="#4A3566"/>
    <text x="1266" y="327" text-anchor="middle" class="sans" fill="#D8B4FE" font-size="14" font-weight="620">返工</text>

    <g id="specialist-analysis">
      <rect x="920" y="180" width="280" height="70" rx="13" fill="#171525" stroke="#7C3AED" stroke-width="1.5"/>
      <circle cx="950" cy="215" r="8" fill="#A855F7"/>
      <text x="976" y="211" class="sans primary" font-size="18" font-weight="650">方案与分析</text>
      <text x="976" y="234" class="sans secondary" font-size="14">理解问题 · 提出判断</text>
    </g>

    <g id="specialist-create">
      <rect x="920" y="285" width="280" height="70" rx="13" fill="#13202B" stroke="#3B82F6" stroke-width="1.5"/>
      <circle cx="950" cy="320" r="8" fill="#60A5FA"/>
      <text x="976" y="316" class="sans primary" font-size="18" font-weight="650">执行与产出</text>
      <text x="976" y="339" class="sans secondary" font-size="14">修改项目 · 交付结果</text>
    </g>

    <g id="specialist-verify">
      <rect x="920" y="390" width="280" height="70" rx="13" fill="#10231A" stroke="#10B981" stroke-width="1.5"/>
      <circle cx="950" cy="425" r="8" fill="#4ADE80"/>
      <text x="976" y="421" class="sans primary" font-size="18" font-weight="650">复核与验证</text>
      <text x="976" y="444" class="sans secondary" font-size="14">发现问题 · 携带证据</text>
    </g>

    <text x="900" y="515" class="mono muted" font-size="13">示意职责 · 不代表固定顺序</text>
  </g>

  <!-- Legend -->
  <g id="legend" class="sans">
    <path d="M64 585H104" stroke="#C090FF" stroke-width="3" marker-end="url(#arrow-purple)"/>
    <text x="120" y="591" class="secondary" font-size="15" font-weight="580">目标与派工</text>
    <path d="M278 585H318" stroke="#4ADE80" stroke-width="3" marker-end="url(#arrow-green)"/>
    <text x="334" y="591" class="secondary" font-size="15" font-weight="580">证据与结果</text>
    <text x="1336" y="591" text-anchor="end" class="mono secondary" font-size="15">控制权最终回到 Leader Agent</text>
  </g>
</svg>
