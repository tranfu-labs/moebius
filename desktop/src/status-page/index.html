<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moebius</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="stylesheet" href="./status.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <h1 class="brand-title">
          <img src="./moebius-icon-64.png" width="32" height="32" alt="" />
          <span>Moebius</span>
        </h1>
        <span id="version">v0.1.0</span>
      </header>

      <section class="section">
        <h2 data-i18n="section.environment"></h2>
        <div class="row">
          <span id="local-console-dot" class="dot muted"></span>
          <span class="label" data-i18n="label.localConsole"></span>
          <span id="local-console-status" class="value"></span>
        </div>
        <div class="row">
          <span id="codex-dot" class="dot muted"></span>
          <span class="label">codex CLI</span>
          <span id="codex-status" class="value"></span>
        </div>
        <div class="row">
          <span id="config-dot" class="dot muted"></span>
          <span class="label" data-i18n="label.localFiles"></span>
          <span id="config-status" class="value"></span>
          <button id="open-data-root" type="button" data-i18n="action.openDataRoot"></button>
        </div>
      </section>

      <footer class="footer">
        <span id="data-root"></span>
      </footer>
    </main>
    <script type="module" src="./status.js"></script>
  </body>
</html>
