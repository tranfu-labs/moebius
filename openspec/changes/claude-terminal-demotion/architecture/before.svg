<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="440" viewBox="0 0 1160 440" role="img" aria-labelledby="title desc">
  <title id="title">Claude terminal placement before the change</title>
  <desc id="desc">Raw PTY bytes go straight into the main timeline run block as a read-only terminal, and there is no path back from the user to the PTY.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#334155"/></marker></defs>
  <rect width="1160" height="440" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#172033">
    <text x="42" y="44" font-size="24" font-weight="700">Before · the PTY is the interface</text>
    <text x="42" y="72" font-size="14" fill="#64748b">The user can see the TUI menu in the timeline but has no way to answer it.</text>
    <rect x="42" y="176" width="180" height="106" rx="10" fill="#fff" stroke="#334155"/><text x="86" y="216" font-size="17">Claude PTY</text><text x="62" y="244" font-size="13" fill="#475569">raw terminal bytes</text><text x="62" y="266" font-size="13" fill="#475569">may wait on a prompt</text>
    <rect x="298" y="176" width="212" height="106" rx="10" fill="#fff" stroke="#334155"/><text x="330" y="216" font-size="16">Active-run trace</text><text x="330" y="244" font-size="13" fill="#475569">live run only</text><text x="330" y="266" font-size="13" fill="#475569">discarded after</text>
    <rect x="586" y="140" width="268" height="178" rx="10" fill="#fee2e2" stroke="#dc2626"/><text x="616" y="180" font-size="17">Main timeline run block</text><text x="618" y="212" font-size="13" fill="#475569">xterm, ANSI redraw</text><text x="618" y="238" font-size="13" fill="#475569">disableStdin, keys ignored</text><text x="618" y="266" font-size="13" fill="#475569">no process steps</text><text x="618" y="294" font-size="13" fill="#475569">menu visible, unanswerable</text>
    <rect x="924" y="176" width="194" height="106" rx="10" fill="#f1f5f9" stroke="#94a3b8"/><text x="962" y="216" font-size="16">Process tab</text><text x="950" y="244" font-size="13" fill="#475569">native records only</text><text x="950" y="266" font-size="13" fill="#475569">no terminal replay</text>
    <path d="M222 228H282" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M510 228H570" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M720 318V366H300V282" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#arrow)"/>
    <text x="330" y="396" font-size="14" fill="#dc2626">no return path exists</text>
  </g>
</svg>
