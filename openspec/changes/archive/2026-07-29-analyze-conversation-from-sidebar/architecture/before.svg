<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">对话分析入口变更前架构</title>
  <desc id="desc">只有消息或运行记录能够触发分析，renderer 用可空 runId 请求 reference-text，local-console 在 runId 缺失时猜测最近外部执行。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5E6AD2"/></marker>
    <style>
      .box{fill:#171717;stroke:#4b4b4b;stroke-width:1.5;rx:12}
      .accent{fill:#1d2035;stroke:#5E6AD2;stroke-width:1.7;rx:12}
      .label{fill:#f2f2f2;font:600 15px system-ui,sans-serif}
      .copy{fill:#b7b7b7;font:13px system-ui,sans-serif}
      .line{stroke:#5E6AD2;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="520" fill="#101010"/>
  <text x="40" y="44" class="label">现状：消息入口 + 含糊的可空 runId</text>
  <rect x="45" y="90" width="250" height="120" class="accent"/>
  <text x="65" y="124" class="label">OperatorConsole</text>
  <text x="65" y="154" class="copy">消息 / run 更多菜单</text>
  <text x="65" y="180" class="copy">左侧栏没有分析入口</text>
  <rect x="355" y="90" width="250" height="120" class="box"/>
  <text x="375" y="124" class="label">desktop renderer</text>
  <text x="375" y="154" class="copy">analyzeConversation(session, run?)</text>
  <text x="375" y="180" class="copy">直接写草稿与 tabs</text>
  <rect x="665" y="90" width="250" height="120" class="box"/>
  <text x="685" y="124" class="label">local-console</text>
  <text x="685" y="154" class="copy">reference-text?runId=...</text>
  <text x="685" y="180" class="copy">缺省取最近 provider link</text>
  <path d="M295 150H355" class="line"/>
  <path d="M605 150H665" class="line"/>
  <rect x="355" y="300" width="250" height="120" class="box"/>
  <text x="375" y="334" class="label">sidebar chat draft + tabs</text>
  <text x="375" y="364" class="copy">同一 session-analysis 模板</text>
  <text x="375" y="390" class="copy">普通新对话生产组合</text>
  <path d="M480 210V300" class="line"/>
</svg>
