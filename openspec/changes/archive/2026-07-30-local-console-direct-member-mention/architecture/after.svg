<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', sans-serif; fill: #111827; }
    .title { font-size: 22px; font-weight: 600; }
    .label { font-size: 15px; font-weight: 600; }
    .sub { font-size: 12px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#5e6ad2"/></marker>
    <marker id="amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#d97706"/></marker>
    <marker id="cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#0891b2"/></marker>
  </defs>
  <rect width="1120" height="700" fill="#fff"/>
  <text x="48" y="48" class="title">改造后：唯一 mention 路由 + 主理人与成员独立持久 FIFO</text>

  <rect x="48" y="94" width="210" height="92" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="153" y="128" text-anchor="middle" class="label">composer</text>
  <text x="153" y="152" text-anchor="middle" class="sub">正文 + 附件</text>
  <text x="153" y="172" text-anchor="middle" class="sub">发送不隐式中断 run</text>

  <rect x="342" y="82" width="302" height="116" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="493" y="116" text-anchor="middle" class="label">local user-message router</text>
  <text x="493" y="140" text-anchor="middle" class="sub">effective snapshot + 代码区域外 mention</text>
  <text x="493" y="162" text-anchor="middle" class="sub">唯一目标直达；无效 / 无 / 多目标回主理人</text>
  <text x="493" y="184" text-anchor="middle" class="sub">pending switch → awaiting-team</text>
  <path d="M258 140H342" stroke="#5e6ad2" stroke-width="2" marker-end="url(#blue)"/>

  <rect x="730" y="82" width="328" height="116" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="894" y="116" text-anchor="middle" class="label">session_messages dispatch 事实</text>
  <text x="894" y="140" text-anchor="middle" class="sub">lane · target role · reason · status</text>
  <text x="894" y="162" text-anchor="middle" class="sub">SQLite 原子 append / claim / terminal</text>
  <text x="894" y="184" text-anchor="middle" class="sub">重启、迁移与团队切换共享</text>
  <path d="M644 140H730" stroke="#5e6ad2" stroke-width="2" marker-end="url(#blue)"/>

  <rect x="72" y="292" width="270" height="106" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="207" y="326" text-anchor="middle" class="label">主理人车道 + FIFO</text>
  <text x="207" y="350" text-anchor="middle" class="sub">默认、无效、多目标</text>
  <text x="207" y="372" text-anchor="middle" class="sub">每 session 最多一个 active run</text>

  <rect x="425" y="292" width="270" height="106" rx="10" fill="#ecfeff" stroke="#a5f3fc"/>
  <text x="560" y="326" text-anchor="middle" class="label">qa 车道 + 持久 FIFO</text>
  <text x="560" y="350" text-anchor="middle" class="sub">唯一 @qa 直达</text>
  <text x="560" y="372" text-anchor="middle" class="sub">忙时排队，不 abort</text>

  <rect x="778" y="292" width="270" height="106" rx="10" fill="#ecfeff" stroke="#a5f3fc"/>
  <text x="913" y="326" text-anchor="middle" class="label">dev / 其他成员车道</text>
  <text x="913" y="350" text-anchor="middle" class="sub">按 session + role 隔离</text>
  <text x="913" y="372" text-anchor="middle" class="sub">不同成员可并行</text>

  <path d="M812 198C700 236 338 236 207 292" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#amber)"/>
  <path d="M894 198V238C760 246 638 250 560 292" fill="none" stroke="#0891b2" stroke-width="2" marker-end="url(#cyan)"/>
  <path d="M976 198C1050 236 1014 258 913 292" fill="none" stroke="#0891b2" stroke-width="2" marker-end="url(#cyan)"/>

  <rect x="72" y="492" width="296" height="102" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="220" y="526" text-anchor="middle" class="label">Agent 回复共享 cursor</text>
  <text x="220" y="550" text-anchor="middle" class="sub">显式 handoff 继续</text>
  <text x="220" y="572" text-anchor="middle" class="sub">专业成员无 mention 回主理人</text>

  <rect x="412" y="492" width="296" height="102" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="560" y="526" text-anchor="middle" class="label">activeRuns + pendingDispatch</text>
  <text x="560" y="550" text-anchor="middle" class="sub">真实目标、runId、恢复状态</text>
  <text x="560" y="572" text-anchor="middle" class="sub">primary 兼容投影保持</text>

  <rect x="752" y="492" width="296" height="102" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="900" y="526" text-anchor="middle" class="label">operator console 待发射区</text>
  <text x="900" y="550" text-anchor="middle" class="sub">显示目标成员与 FIFO 顺序</text>
  <text x="900" y="572" text-anchor="middle" class="sub">重启后仍可观察</text>

  <path d="M207 398C196 438 202 462 220 492" fill="none" stroke="#5e6ad2" stroke-width="2" marker-end="url(#blue)"/>
  <path d="M560 398V492" stroke="#5e6ad2" stroke-width="2" marker-end="url(#blue)"/>
  <path d="M913 398C832 448 722 462 632 492" fill="none" stroke="#5e6ad2" stroke-width="2" marker-end="url(#blue)"/>
  <path d="M708 543H752" stroke="#5e6ad2" stroke-width="2" marker-end="url(#blue)"/>
  <path d="M412 543H368" stroke="#5e6ad2" stroke-width="2" marker-end="url(#blue)"/>

  <text x="48" y="662" class="sub">蓝色：持久状态与投影；青色：用户唯一 mention 直达；琥珀色：默认主理人路由。</text>
</svg>
