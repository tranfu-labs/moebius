<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520">
  <rect width="1120" height="520" fill="#ffffff"/>
  <style>
    text { font-family: Arial, sans-serif; font-size: 15px; fill: #1f2937; }
    .title { font-size: 20px; font-weight: 700; }
    .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 8; }
    .accent { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.8; rx: 8; }
    .muted { fill: #64748b; font-size: 13px; }
    .danger { fill: #991b1b; font-size: 13px; }
    .line { stroke: #475569; stroke-width: 1.8; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
  <text x="36" y="42" class="title">Before · friendly process timeline</text>
  <text x="36" y="68" class="muted">Baseline: docs/architecture/local-console-operator.svg and module-map local-console / console-ui boundaries</text>

  <rect x="40" y="105" width="210" height="115" class="box"/>
  <text x="64" y="140">Codex rollout JSONL</text>
  <text x="64" y="168" class="muted">prompt + model + events</text>
  <text x="64" y="192" class="muted">owned by Codex</text>

  <rect x="320" y="105" width="230" height="115" class="box"/>
  <text x="344" y="140">Trusted rollout resolver</text>
  <text x="344" y="168" class="muted">run → thread → unique file</text>
  <text x="344" y="192" class="muted">root / inode validation</text>
  <line x1="250" y1="162" x2="320" y2="162" class="line"/>

  <rect x="620" y="90" width="235" height="145" class="accent"/>
  <text x="644" y="126">Friendly projector</text>
  <text x="644" y="154" class="danger">drops prompts / model context</text>
  <text x="644" y="178" class="danger">redacts paths and internal ids</text>
  <text x="644" y="202" class="muted">unknown → generic placeholder</text>
  <line x1="550" y1="162" x2="620" y2="162" class="line"/>

  <rect x="905" y="105" width="175" height="115" class="box"/>
  <text x="929" y="140">Process API</text>
  <text x="929" y="168" class="muted">reverse pages</text>
  <text x="929" y="192" class="muted">append cursor</text>
  <line x1="855" y1="162" x2="905" y2="162" class="line"/>

  <rect x="620" y="325" width="235" height="115" class="box"/>
  <text x="644" y="360">Desktop fetch adapter</text>
  <text x="644" y="388" class="muted">poll + merge pages</text>
  <text x="644" y="412" class="muted">one async stream</text>
  <line x1="992" y1="220" x2="992" y2="275" class="line"/>
  <line x1="992" y1="275" x2="738" y2="275" class="line"/>
  <line x1="738" y1="275" x2="738" y2="325" class="line"/>

  <rect x="320" y="325" width="230" height="115" class="box"/>
  <text x="344" y="360">ProcessTab</text>
  <text x="344" y="388" class="muted">friendly events + public input</text>
  <text x="344" y="412" class="muted">second path / id redaction</text>
  <line x1="620" y1="382" x2="550" y2="382" class="line"/>

  <rect x="40" y="325" width="210" height="115" class="box"/>
  <text x="64" y="360">Session facts</text>
  <text x="64" y="388" class="muted">thread link + run timing</text>
  <text x="64" y="412" class="muted">no rollout copy</text>
  <line x1="250" y1="382" x2="320" y2="382" class="line"/>
</svg>
