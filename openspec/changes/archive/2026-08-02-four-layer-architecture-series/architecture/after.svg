<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="690" viewBox="0 0 1180 690" role="img" aria-labelledby="title desc">
  <title id="title">Moebius four-layer architecture after migration</title>
  <desc id="desc">Every production file belongs to view, application, domain, or adapter with enforced dependency directions.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #172033; }
    .title { font-size: 24px; font-weight: 700; }
    .label { font-size: 17px; font-weight: 650; }
    .body { font-size: 14px; }
    .view { fill: #f7efff; stroke: #8a53b6; stroke-width: 2; }
    .app { fill: #fff1df; stroke: #d27b22; stroke-width: 2; }
    .domain { fill: #eaf8ee; stroke: #2f8a4d; stroke-width: 2; }
    .adapter { fill: #eaf2ff; stroke: #4076b8; stroke-width: 2; }
    .gate { fill: #f1f3f6; stroke: #536174; stroke-width: 2; }
    .arrow { stroke: #536174; stroke-width: 2; marker-end: url(#arrow); }
    .dashed { stroke: #536174; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#536174"/>
    </marker>
  </defs>
  <text x="42" y="44" class="title">After: one of four layers, one enforced direction</text>
  <rect x="75" y="100" width="250" height="155" rx="18" class="view"/>
  <text x="102" y="137" class="label">View</text>
  <text x="102" y="169" class="body">console-ui · renderer views</text>
  <text x="102" y="195" class="body">state → pixels; intent outward</text>
  <text x="102" y="221" class="body">no IO adapters</text>
  <rect x="465" y="100" width="250" height="155" rx="18" class="app"/>
  <text x="492" y="137" class="label">Application</text>
  <text x="492" y="169" class="body">use-case orchestration</text>
  <text x="492" y="195" class="body">async ownership · commit order</text>
  <text x="492" y="221" class="body">ports, no copied domain rule</text>
  <rect x="855" y="100" width="250" height="155" rx="18" class="adapter"/>
  <text x="882" y="137" class="label">Adapters</text>
  <text x="882" y="169" class="body">fs · SQLite/JSONL · provider</text>
  <text x="882" y="195" class="body">HTTP · IPC · browser storage</text>
  <text x="882" y="221" class="body">implements application ports</text>
  <rect x="465" y="330" width="250" height="165" rx="18" class="domain"/>
  <text x="492" y="367" class="label">Domain</text>
  <text x="492" y="399" class="body">plain-value decisions</text>
  <text x="492" y="425" class="body">transitive pure closure</text>
  <text x="492" y="451" class="body">direct deterministic tests</text>
  <line x1="325" y1="178" x2="465" y2="178" class="arrow"/>
  <line x1="715" y1="178" x2="855" y2="178" class="dashed"/>
  <line x1="590" y1="255" x2="590" y2="330" class="arrow"/>
  <line x1="855" y1="230" x2="715" y2="363" class="arrow"/>
  <rect x="185" y="555" width="810" height="92" rx="18" class="gate"/>
  <text x="220" y="590" class="label">check:boundaries preflight</text>
  <text x="220" y="618" class="body">total assignment · dependency matrix · domain transitive closure · exact composition roots · zero legacy debt</text>
  <line x1="590" y1="555" x2="590" y2="495" class="dashed"/>
  <text x="75" y="300" class="body">View may consume domain/view models only.</text>
  <text x="805" y="300" class="body">Concrete adapter assembly is exact-root only.</text>
</svg>
