<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="820" viewBox="0 0 1320 820" role="img" aria-labelledby="title desc">
  <title id="title">分析对话树所见即所传架构</title>
  <desc id="desc">分析会话直接归属于父会话；文本片段逐字进入用户消息和 Agent 输入，内部引用只驱动用户导航。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>
      .box{fill:#f8fafc;stroke:#475569;stroke-width:2;rx:14}.good{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:14}.ui{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:14}
      .label{font:600 17px system-ui;fill:#0f172a}.small{font:14px system-ui;fill:#334155}.line{stroke:#475569;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}
    </style>
  </defs>
  <text x="44" y="42" class="label">会话模型 / 可见片段 / 跨树路由</text>
  <rect x="50" y="90" width="250" height="110" class="good"/><text x="76" y="130" class="label">Session facts + SQLite</text><text x="76" y="158" class="small">analysis_parent_session_id</text><text x="76" y="181" class="small">entry_template=session-analysis</text>
  <rect x="390" y="90" width="240" height="110" class="good"/><text x="420" y="130" class="label">直接子项投影</text><text x="420" y="158" class="small">只查当前父 session</text><text x="420" y="181" class="small">不进入左栏 / 子任务</text>
  <rect x="720" y="80" width="250" height="130" class="ui"/><text x="750" y="120" class="label">生产 AnalysisPanel</text><text x="750" y="148" class="small">进程内开合 Map</text><text x="750" y="171" class="small">空 / 加载 / 失败 / 列表</text><text x="750" y="194" class="small">仅触发入口</text>
  <line x1="300" y1="145" x2="390" y2="145" class="line"/><line x1="630" y1="145" x2="720" y2="145" class="line"/>
  <rect x="1050" y="80" width="230" height="130" class="ui"/><text x="1078" y="120" class="label">根标签组</text><text x="1078" y="148" class="small">唯一 conversation source</text><text x="1078" y="171" class="small">父 / 子为兄弟标签</text><text x="1078" y="194" class="small">无嵌套右侧栏</text>
  <line x1="970" y1="145" x2="1050" y2="145" class="line"/>

  <rect x="50" y="300" width="250" height="130" class="box"/><text x="76" y="340" class="label">可见文本片段</text><text x="76" y="368" class="small">完整文本可悬浮 / 聚焦</text><text x="76" y="392" class="small">moebius-ref 仅为 Markdown</text><text x="76" y="416" class="small">显示多少就传多少</text>
  <rect x="390" y="300" width="240" height="130" class="good"/><text x="420" y="340" class="label">唯一来源块序列化</text><text x="420" y="368" class="small">按用户顺序各写一次</text><text x="420" y="392" class="small">持久化用户消息</text><text x="420" y="416" class="small">无隐藏来源正文</text>
  <line x1="300" y1="365" x2="390" y2="365" class="line"/>
  <rect x="720" y="300" width="250" height="130" class="good"/><text x="750" y="340" class="label">Agent prompt</text><text x="750" y="368" class="small">只读取可见消息文本</text><text x="750" y="392" class="small">重试 / 恢复不刷新</text><text x="750" y="416" class="small">忽略旧 referenceContext</text>
  <line x1="630" y1="365" x2="720" y2="365" class="line"/>

  <rect x="390" y="490" width="240" height="120" class="box"/><text x="420" y="530" class="label">Markdown link node</text><text x="420" y="558" class="small">严格语法 / AST 位置</text><text x="420" y="582" class="small">仅在用户激活时解析</text>
  <rect x="720" y="490" width="250" height="120" class="ui"/><text x="750" y="530" class="label">导航路由</text><text x="750" y="558" class="small">解析根会话 + 标签现场</text><text x="750" y="582" class="small">目标不可用仅导航降级</text>
  <line x1="630" y1="550" x2="720" y2="550" class="line"/><line x1="970" y1="550" x2="1050" y2="175" class="line dash"/>

  <rect x="180" y="670" width="270" height="100" class="box"/><text x="208" y="710" class="label">pending primary FIFO</text><text x="208" y="738" class="small">无来源预读或额外阻塞</text>
  <rect x="535" y="670" width="270" height="100" class="box"/><text x="563" y="710" class="label">归档 / 项目移除</text><text x="563" y="738" class="small">分析后代闭包 + 运行检查</text>
  <rect x="890" y="670" width="270" height="100" class="ui"/><text x="918" y="710" class="label">renderer reconcile</text><text x="918" y="738" class="small">失败保持原工作现场</text>
  <line x1="450" y1="720" x2="535" y2="720" class="line dash"/><line x1="805" y1="720" x2="890" y2="720" class="line"/>
</svg>
