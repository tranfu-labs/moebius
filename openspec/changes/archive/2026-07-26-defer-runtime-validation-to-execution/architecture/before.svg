  <rect width="980" height="360" fill="#101010"/>
  <g font-family="Arial, sans-serif" font-size="16" fill="#f4f4f5" stroke="#52525b" stroke-width="2">
    <rect x="40" y="55" width="170" height="70" rx="12" fill="#171717"/>
    <rect x="285" y="25" width="190" height="60" rx="12" fill="#171717"/>
    <rect x="285" y="105" width="190" height="60" rx="12" fill="#2b2612"/>
    <rect x="285" y="185" width="190" height="60" rx="12" fill="#2b2612"/>
    <rect x="555" y="80" width="180" height="100" rx="12" fill="#171717"/>
    <rect x="790" y="95" width="150" height="70" rx="12" fill="#171717"/>
    <rect x="285" y="285" width="190" height="55" rx="12" fill="#171717"/>
    <rect x="555" y="275" width="180" height="70" rx="12" fill="#171717"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#f4f4f5" text-anchor="middle">
    <text x="125" y="88">团队详情打开</text><text x="125" y="110">显示 loading</text>
