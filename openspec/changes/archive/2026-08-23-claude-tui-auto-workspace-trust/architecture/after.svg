<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-labelledby="title desc">
  <title id="title">Claude workspace trust after automatic confirmation</title>
  <desc id="desc">The pre-task detector writes one native Enter to the same PTY, then waits for the normal prompt before writing the original task.</desc>
  <style>
    .node { fill: #171717; stroke: #5e6ad2; stroke-width: 2; rx: 12; }
    .text { fill: #f0f0f0; font: 16px sans-serif; text-anchor: middle; }
    .small { fill: #b5b5b5; font: 13px sans-serif; text-anchor: middle; }
    .arrow { stroke: #828fff; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#828fff"/></marker></defs>
  <rect width="960" height="250" fill="#101010"/>
  <rect class="node" x="35" y="78" width="160" height="78"/><text class="text" x="115" y="108">Claude PTY</text><text class="small" x="115" y="132">native prompt bytes</text>
  <rect class="node" x="265" y="78" width="200" height="78"/><text class="text" x="365" y="108">Pre-task detector</text><text class="small" x="365" y="132">one exact match</text>
  <rect class="node" x="535" y="78" width="175" height="78"/><text class="text" x="622" y="108">Same PTY</text><text class="small" x="622" y="132">one native Enter</text>
  <rect class="node" x="780" y="78" width="145" height="78"/><text class="text" x="852" y="108">Normal prompt</text><text class="small" x="852" y="132">then original task</text>
  <line class="arrow" x1="195" y1="117" x2="265" y2="117"/><line class="arrow" x1="465" y1="117" x2="535" y2="117"/><line class="arrow" x1="710" y1="117" x2="780" y2="117"/>
  <text class="small" x="480" y="192">raw terminal trace, hooks and transcript remain separate; no UI or HTTP trust control</text>
</svg>
