<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-labelledby="title desc">
  <title id="title">Claude workspace trust before automatic confirmation</title>
  <desc id="desc">The detected native prompt travels through local console and the desktop dialog before Enter reaches the same PTY.</desc>
  <style>
    .node { fill: #171717; stroke: #5e6ad2; stroke-width: 2; rx: 12; }
    .text { fill: #f0f0f0; font: 16px sans-serif; text-anchor: middle; }
    .small { fill: #b5b5b5; font: 13px sans-serif; text-anchor: middle; }
    .arrow { stroke: #828fff; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#828fff"/></marker></defs>
  <rect width="960" height="250" fill="#101010"/>
  <rect class="node" x="30" y="78" width="150" height="78"/><text class="text" x="105" y="108">Claude PTY</text><text class="small" x="105" y="132">native prompt bytes</text>
  <rect class="node" x="230" y="78" width="160" height="78"/><text class="text" x="310" y="108">Detector</text><text class="small" x="310" y="132">trust required</text>
  <rect class="node" x="440" y="78" width="160" height="78"/><text class="text" x="520" y="108">Local console</text><text class="small" x="520" y="132">active-run state / HTTP</text>
  <rect class="node" x="650" y="78" width="130" height="78"/><text class="text" x="715" y="108">Desktop</text><text class="small" x="715" y="132">trust dialog</text>
  <rect class="node" x="830" y="78" width="100" height="78"/><text class="text" x="880" y="108">PTY</text><text class="small" x="880" y="132">Enter</text>
  <line class="arrow" x1="180" y1="117" x2="230" y2="117"/><line class="arrow" x1="390" y1="117" x2="440" y2="117"/><line class="arrow" x1="600" y1="117" x2="650" y2="117"/><line class="arrow" x1="780" y1="117" x2="830" y2="117"/>
  <text class="small" x="715" y="188">manual decision gates the original task</text>
</svg>
