<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', sans-serif; fill: #111827; }
    .title { font-size: 22px; font-weight: 600; }
    .label { font-size: 15px; font-weight: 600; }
    .sub { font-size: 12px; fill: #6b7280; }
    .good { font-size: 12px; fill: #047857; }
  </style>
  <defs>
    <marker id="blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#5e6ad2"/></marker>
    <marker id="cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#0891b2"/></marker>
    <marker id="green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#059669"/></marker>
  </defs>
  <rect width="1240" height="820" fill="#fff"/>
  <text x="48" y="48" class="title">改造后：共享终局与进展契约 + 语义监督 + 一次性执行配置重跑</text>

  <rect x="46" y="94" width="230" height="104" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="161" y="126" text-anchor="middle" class="label">Codex adapter</text>
  <text x="161" y="152" text-anchor="middle" class="sub">terminal + progress 显式映射</text>
  <text x="161" y="176" text-anchor="middle" class="good">stdout 字节不再是进展</text>

  <rect x="46" y="246" width="230" height="104" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="161" y="278" text-anchor="middle" class="label">Claude adapter</text>
  <text x="161" y="304" text-anchor="middle" class="sub">text/thinking/tool 解嵌套</text>
  <text x="161" y="328" text-anchor="middle" class="good">quota/rate/auth 结构化</text>

  <rect x="46" y="398" width="230" height="128" rx="10" fill="#ecfeff" stroke="#a5f3fc"/>
  <text x="161" y="430" text-anchor="middle" class="label">Kimi ACP adapter</text>
  <text x="161" y="456" text-anchor="middle" class="sub">message/thought/tool 映射</text>
  <text x="161" y="480" text-anchor="middle" class="good">检查 stopReason + 完整回复</text>
  <text x="161" y="504" text-anchor="middle" class="good">保留 raw JSON-RPC 诊断</text>

  <rect x="350" y="180" width="304" height="244" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="502" y="214" text-anchor="middle" class="label">共享纯执行契约</text>
  <text x="502" y="244" text-anchor="middle" class="sub">ExecutionTerminal 判别联合</text>
  <text x="502" y="268" text-anchor="middle" class="sub">completed · interrupted · timeout</text>
  <text x="502" y="292" text-anchor="middle" class="sub">quota · rate-limit · auth · crashed</text>
  <text x="502" y="324" text-anchor="middle" class="sub">ExecutionProgressEvent</text>
  <text x="502" y="348" text-anchor="middle" class="sub">正文 · reasoning · tool · file · retry</text>
  <text x="502" y="382" text-anchor="middle" class="good">assertNever；未知 payload 安全降级</text>

  <path d="M276 146C316 146 320 222 350 238" fill="none" stroke="#5e6ad2" stroke-width="2" marker-end="url(#blue)"/>
  <path d="M276 298H350" stroke="#5e6ad2" stroke-width="2" marker-end="url(#blue)"/>
  <path d="M276 462C320 450 320 380 350 366" fill="none" stroke="#0891b2" stroke-width="2" marker-end="url(#cyan)"/>

  <rect x="744" y="82" width="418" height="196" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="953" y="116" text-anchor="middle" class="label">纯 run supervisor</text>
  <text x="953" y="144" text-anchor="middle" class="sub">只有正文/reasoning/tool/file 刷新 idle</text>
  <text x="953" y="168" text-anchor="middle" class="sub">工具在途 → 独立 30 分钟闸，结束后恢复 idle</text>
  <text x="953" y="192" text-anchor="middle" class="sub">provider retry → busy phase，不刷新 idle</text>
  <text x="953" y="216" text-anchor="middle" class="sub">busy 默认 5 分钟；long-run 15 分钟只报告</text>
  <text x="953" y="242" text-anchor="middle" class="good">local 无 120 分钟 wall-clock kill</text>
  <text x="953" y="264" text-anchor="middle" class="sub">其他模式/provider max 仍可结构化表达</text>
  <path d="M654 258C700 240 706 202 744 190" fill="none" stroke="#5e6ad2" stroke-width="2" marker-end="url(#blue)"/>

  <rect x="744" y="330" width="418" height="176" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="953" y="364" text-anchor="middle" class="label">JSONL terminal fact + SQLite 投影</text>
  <text x="953" y="392" text-anchor="middle" class="sub">terminal kind · safeCode · elapsed</text>
  <text x="953" y="416" text-anchor="middle" class="sub">partialMarkdown · contentIncomplete</text>
  <text x="953" y="440" text-anchor="middle" class="sub">step · attempt · run 关联</text>
  <text x="953" y="470" text-anchor="middle" class="good">成功回复与异常 partial 永不双写</text>
  <path d="M654 332C700 344 708 390 744 406" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#green)"/>
  <path d="M953 278V330" stroke="#059669" stroke-width="2" marker-end="url(#green)"/>

  <rect x="54" y="624" width="316" height="126" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="212" y="658" text-anchor="middle" class="label">RunOutcome + capability registry</text>
  <text x="212" y="686" text-anchor="middle" class="sub">partial Markdown + 内容不完整 + safe terminal</text>
  <text x="212" y="710" text-anchor="middle" class="sub">重试 / 换执行配置重跑</text>
  <text x="212" y="734" text-anchor="middle" class="good">presentational；不写团队配置</text>

  <rect x="462" y="602" width="318" height="166" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="621" y="636" text-anchor="middle" class="label">single-run override intent</text>
  <text x="621" y="664" text-anchor="middle" class="sub">受信任 registry 校验 profile</text>
  <text x="621" y="688" text-anchor="middle" class="sub">同一步新 attempt，原输入与附件</text>
  <text x="621" y="712" text-anchor="middle" class="sub">base identity + override id + profile</text>
  <text x="621" y="738" text-anchor="middle" class="good">幂等、原子持久化</text>

  <rect x="872" y="602" width="318" height="166" rx="10" fill="#ecfeff" stroke="#a5f3fc"/>
  <text x="1031" y="636" text-anchor="middle" class="label">派生 provider identity</text>
  <text x="1031" y="664" text-anchor="middle" class="sub">首次 full；同 run 恢复只 resume</text>
  <text x="1031" y="688" text-anchor="middle" class="sub">derived link 与 base canonical 隔离</text>
  <text x="1031" y="712" text-anchor="middle" class="sub">终局后普通 run 回基础 profile</text>
  <text x="1031" y="738" text-anchor="middle" class="good">不放宽普通 profile mismatch</text>

  <path d="M953 506C866 570 476 572 314 624" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#green)"/>
  <path d="M370 686H462" stroke="#5e6ad2" stroke-width="2" marker-end="url(#blue)"/>
  <path d="M780 686H872" stroke="#0891b2" stroke-width="2" marker-end="url(#cyan)"/>

  <text x="48" y="796" class="sub">归档目标：docs/architecture/local-runtime-supervision.svg；console-ui 只消费 DTO/callback，执行、身份和持久化仍属于 local-console。</text>
</svg>
