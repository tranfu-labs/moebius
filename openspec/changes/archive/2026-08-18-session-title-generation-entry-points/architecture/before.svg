<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
  <rect width="1000" height="620" fill="#ffffff"/>
  <style>
    text { font-family: Arial, sans-serif; font-size: 15px; fill: #1f2937; }
    .title { font-size: 20px; font-weight: 700; }
    .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 8; }
    .accent { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.8; rx: 8; }
    .domain { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.8; rx: 8; }
    .muted { fill: #64748b; font-size: 13px; }
    .layer { fill: #64748b; font-size: 12px; font-weight: 700; letter-spacing: 1px; }
    .line { stroke: #475569; stroke-width: 1.8; marker-end: url(#arrow); }
    .dash { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 4; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="36" y="42" class="title">新会话自动命名（提示词 v2）</text>

  <!-- 触发层 -->
  <rect x="40" y="78" width="220" height="96" class="accent"/>
  <text x="64" y="112">用户发送首条消息</text>
  <text x="64" y="140" class="muted">POST /sessions/:id/messages</text>
  <text x="64" y="160" class="muted">server.ts（adapter）</text>

  <rect x="360" y="78" width="250" height="96" class="box"/>
  <text x="384" y="112">message-command-runtime.submit</text>
  <text x="384" y="140" class="muted">application · 追加消息前捕获</text>
  <text x="384" y="160" class="muted">wasFirstMessage（消息存在性）</text>
  <line x1="260" y1="126" x2="360" y2="126" class="line"/>

  <rect x="700" y="78" width="250" height="96" class="box"/>
  <text x="724" y="112">appendUserMessage</text>
  <text x="724" y="140" class="muted">SQLite + jsonl 事实日志</text>
  <text x="724" y="160" class="muted">既有持久化链路（零改动）</text>
  <line x1="610" y1="126" x2="700" y2="126" class="line"/>

  <!-- 判定 + 分支 -->
  <rect x="360" y="230" width="250" height="96" class="domain"/>
  <text x="384" y="264">decideTitleGeneration</text>
  <text x="384" y="292" class="muted">domain · session-title-plan.ts</text>
  <text x="384" y="312" class="muted">首条消息且有文本 → generate</text>
  <line x1="485" y1="174" x2="485" y2="230" class="line"/>

  <rect x="700" y="230" width="250" height="96" class="box"/>
  <text x="724" y="264">主流程（既有链路）</text>
  <text x="724" y="292" class="muted">processPending → agent run</text>
  <text x="724" y="312" class="muted">与标题生成并行，互不阻塞</text>
  <line x1="610" y1="240" x2="700" y2="240" class="dash"/>

  <!-- 生成编排 -->
  <rect x="360" y="382" width="250" height="110" class="accent"/>
  <text x="384" y="416">session-title-runtime.generateTitle</text>
  <text x="384" y="444" class="muted">application · 异步 fire-and-forget</text>
  <text x="384" y="464" class="muted">并发守卫（同会话只一个在途）</text>
  <text x="384" y="484" class="muted">失败静默降级，不重试</text>
  <line x1="485" y1="326" x2="485" y2="382" class="line"/>

  <rect x="40" y="382" width="220" height="110" class="box"/>
  <text x="64" y="416">one-shot 完成端口</text>
  <text x="64" y="444" class="muted">execution-driver（adapter）</text>
  <text x="64" y="464" class="muted">隔离 runDir（TMP_ROOT）</text>
  <text x="64" y="484" class="muted">会话主 Agent 的 execution profile</text>
  <line x1="360" y1="437" x2="260" y2="437" class="line"/>

  <rect x="40" y="548" width="220" height="52" class="box"/>
  <text x="64" y="580">Provider CLI（codex/claude/kimi/pi）</text>
  <line x1="150" y1="492" x2="150" y2="548" class="line"/>

  <!-- 清洗 + 落库 -->
  <rect x="360" y="548" width="250" height="52" class="domain"/>
  <text x="384" y="580">sanitizeGeneratedTitle（≤20 字清洗）</text>
  <line x1="150" y1="548" x2="330" y2="548" class="dash"/>
  <line x1="485" y1="492" x2="485" y2="548" class="line"/>

  <rect x="700" y="382" width="250" height="110" class="box"/>
  <text x="724" y="416">renameSession（既有端点）</text>
  <text x="724" y="444" class="muted">expectedTitleRevision: 0 乐观锁</text>
  <text x="724" y="464" class="muted">SQLite sessions.title + title_revision</text>
  <text x="724" y="484" class="muted">用户已改名/会话消失 → 静默</text>
  <line x1="610" y1="437" x2="950" y2="437" class="dash"/>
  <line x1="950" y1="437" x2="950" y2="560" class="dash"/>
  <rect x="700" y="548" width="250" height="52" class="box"/>
  <text x="724" y="580">客户端 ETag 轮询 /state → 侧边栏显示新标题</text>

  <text x="36" y="620" class="muted">开关：enableSessionTitleGeneration（默认 true，测试基建可关闭）；提示词 v2 为用户确认强基准，逐字内嵌于 domain 常量。</text>
</svg>
