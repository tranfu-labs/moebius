<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <rect width="1000" height="700" fill="#ffffff"/>
  <style>
    text { font-family: Arial, sans-serif; font-size: 15px; fill: #1f2937; }
    .title { font-size: 20px; font-weight: 700; }
    .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 8; }
    .accent { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.8; rx: 8; }
    .domain { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.8; rx: 8; }
    .muted { fill: #64748b; font-size: 13px; }
    .line { stroke: #475569; stroke-width: 1.8; marker-end: url(#arrow); }
    .dash { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 4; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="36" y="42" class="title">新会话自动命名（提示词 v2）· 双入口</text>

  <!-- 入口层：两条首条消息落库路径 -->
  <rect x="40" y="80" width="420" height="96" class="accent"/>
  <text x="64" y="112">入口 A · 桌面新建对话</text>
  <text x="64" y="140" class="muted">POST /sessions + initialMessage（原子创建 + 首条消息）</text>
  <text x="64" y="160" class="muted">session-creation-runtime.create（application）</text>

  <rect x="540" y="80" width="420" height="96" class="accent"/>
  <text x="564" y="112">入口 B · 空会话追加首条消息</text>
  <text x="564" y="140" class="muted">POST /sessions/:id/messages（submit）</text>
  <text x="564" y="160" class="muted">message-command-runtime.submit（application）</text>

  <!-- 落库 -->
  <rect x="40" y="232" width="420" height="72" class="box"/>
  <text x="64" y="264">store.createSession（SQLite + jsonl 原子落库）</text>
  <text x="64" y="286" class="muted">既有持久化链路（零改动）</text>
  <line x1="250" y1="176" x2="250" y2="232" class="line"/>

  <rect x="540" y="232" width="420" height="72" class="box"/>
  <text x="564" y="264">appendUserMessage（SQLite + jsonl）</text>
  <text x="564" y="286" class="muted">既有持久化链路（零改动）</text>
  <line x1="750" y1="176" x2="750" y2="232" class="line"/>

  <!-- 判定：共享 domain 单点 -->
  <rect x="300" y="360" width="400" height="96" class="domain"/>
  <text x="324" y="394">decideTitleGeneration（domain · session-title-plan.ts）</text>
  <text x="324" y="422" class="muted">入口 A：wasFirstMessage 恒 true + 有文本</text>
  <text x="324" y="442" class="muted">入口 B：wasFirstMessage（消息存在性）+ 有文本</text>
  <line x1="250" y1="304" x2="440" y2="360" class="line"/>
  <line x1="750" y1="304" x2="560" y2="360" class="line"/>

  <!-- 生成编排：同一 runtime 实例 -->
  <rect x="300" y="512" width="400" height="110" class="accent"/>
  <text x="324" y="546">session-title-runtime.generateTitle（共享实例）</text>
  <text x="324" y="574" class="muted">application · 异步 fire-and-forget（fireTitleGeneration）</text>
  <text x="324" y="594" class="muted">进程内并发守卫：同会话至多一个在途</text>
  <text x="324" y="614" class="muted">失败静默降级，不重试，不阻塞对话</text>
  <line x1="500" y1="456" x2="500" y2="512" class="line"/>

  <rect x="40" y="512" width="200" height="110" class="box"/>
  <text x="64" y="546">one-shot 完成端口</text>
  <text x="64" y="574" class="muted">execution-driver（adapter）</text>
  <text x="64" y="594" class="muted">隔离 runDir（TMP_ROOT）</text>
  <text x="64" y="614" class="muted">会话主 Agent 的 execution profile</text>
  <line x1="300" y1="567" x2="240" y2="567" class="line"/>

  <rect x="40" y="650" width="200" height="42" class="box"/>
  <text x="64" y="676">Provider CLI（codex/claude/kimi/pi）</text>
  <line x1="140" y1="622" x2="140" y2="650" class="line"/>

  <!-- 清洗 + 落库 -->
  <rect x="300" y="650" width="400" height="42" class="domain"/>
  <text x="324" y="676">sanitizeGeneratedTitle（≤20 字清洗）→ renameSession（乐观锁 expectedTitleRevision: 0）</text>
  <line x1="140" y1="650" x2="270" y2="650" class="dash"/>

  <text x="36" y="700" class="muted">开关：enableSessionTitleGeneration（默认 true，测试基建可关闭）；提示词 v2 为用户确认强基准；客户端经既有 ETag 轮询 /state 展示新标题。</text>
</svg>
