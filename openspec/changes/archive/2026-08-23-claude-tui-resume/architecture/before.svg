<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="420" viewBox="0 0 1160 420" role="img" aria-labelledby="title desc">
  <title id="title">Claude headless execution before the change</title>
  <desc id="desc">Every Claude turn starts a short-lived print-mode child process and parses stream-json into Markdown.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#334155"/></marker></defs>
  <rect width="1160" height="420" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#172033">
    <text x="42" y="44" font-size="24" font-weight="700">Before · Claude headless per-turn execution</text>
    <text x="42" y="72" font-size="14" fill="#64748b">Each user turn creates a fresh child and turns stream-json into public Markdown.</text>
    <rect x="48" y="150" width="180" height="86" rx="10" fill="#e0e7ff" stroke="#4f46e5"/><text x="83" y="186" font-size="17">Local runtime</text><text x="68" y="211" font-size="13" fill="#475569">one provider run</text>
    <rect x="338" y="130" width="220" height="126" rx="10" fill="#fff" stroke="#334155"/><text x="382" y="170" font-size="17">claude -p</text><text x="364" y="198" font-size="13" fill="#475569">stream-json / stdin end</text><text x="364" y="221" font-size="13" fill="#475569">MCP capability per turn</text>
    <rect x="670" y="130" width="190" height="126" rx="10" fill="#fff" stroke="#334155"/><text x="702" y="171" font-size="17">JSONL parser</text><text x="701" y="199" font-size="13" fill="#475569">text deltas</text><text x="693" y="222" font-size="13" fill="#475569">tool projection</text>
    <rect x="954" y="150" width="160" height="86" rx="10" fill="#ecfdf5" stroke="#059669"/><text x="986" y="186" font-size="17">Markdown UI</text><text x="981" y="211" font-size="13" fill="#475569">final result</text>
    <path d="M228 193H322" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M558 193H654" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M860 193H938" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="338" y="330" font-size="14" fill="#b91c1c">No persistent PTY; every subsequent turn is a separate invocation.</text>
  </g>
</svg>
