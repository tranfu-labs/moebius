<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
  <title id="title">Conversation image preview architecture before change</title>
  <desc id="desc">User raster attachments have managed thumbnail previews while Agent local image paths only open as text file references.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5E6AD2"/></marker>
    <style>.box{fill:#fff;stroke:#60646c;stroke-width:1.5;rx:12}.label{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#202124}.note{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#60646c}.line{stroke:#5E6AD2;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1080" height="620" fill="#f7f7f8"/>
  <text x="48" y="52" class="label">Before · split display paths</text>
  <rect class="box" x="48" y="100" width="190" height="76"/><text class="label" x="74" y="132">User local file</text><text class="note" x="74" y="156">PNG/JPEG/GIF/WebP</text>
  <rect class="box" x="300" y="100" width="210" height="76"/><text class="label" x="327" y="132">Chromium thumbnail</text><text class="note" x="327" y="156">bounded PNG</text>
  <rect class="box" x="572" y="100" width="210" height="76"/><text class="label" x="600" y="132">Managed attachment</text><text class="note" x="600" y="156">original + thumbnail</text>
  <rect class="box" x="844" y="100" width="188" height="76"/><text class="label" x="870" y="132">User message card</text><text class="note" x="870" y="156">inline thumbnail</text>
  <path class="line" d="M238 138 H300"/><path class="line" d="M510 138 H572"/><path class="line" d="M782 138 H844"/>
  <rect class="box" x="48" y="334" width="190" height="76"/><text class="label" x="74" y="366">Agent final reply</text><text class="note" x="74" y="390">local absolute path</text>
  <rect class="box" x="300" y="334" width="210" height="76"/><text class="label" x="327" y="366">Markdown file reference</text><text class="note" x="327" y="390">path remains visible</text>
  <rect class="box" x="572" y="334" width="210" height="76"/><text class="label" x="600" y="366">File reference API</text><text class="note" x="600" y="390">text-only read</text>
  <rect class="box" x="844" y="334" width="188" height="76"/><text class="label" x="870" y="366">Right sidebar</text><text class="note" x="870" y="390">source / text preview</text>
  <path class="line" d="M238 372 H300"/><path class="line" d="M510 372 H572"/><path class="line" d="M782 372 H844"/>
  <text class="note" x="48" y="500">SVG uploads remain ordinary files. Agent image paths have no inline image preview or large-image view.</text>
</svg>
