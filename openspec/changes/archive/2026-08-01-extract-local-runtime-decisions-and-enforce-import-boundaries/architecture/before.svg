<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-labelledby="title desc">
  <title id="title">Local console runtime before refactoring</title>
  <desc id="desc">processPending and runWorker each mix decisions with stores, files, providers, and lifecycle effects.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #172033; }
    .title { font-size: 22px; font-weight: 700; }
    .label { font-size: 16px; font-weight: 650; }
    .body { font-size: 14px; }
    .runtime { fill: #fff4df; stroke: #d88918; stroke-width: 2; }
    .io { fill: #eef5ff; stroke: #4076b8; stroke-width: 2; }
    .arrow { stroke: #526174; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#526174"/>
    </marker>
  </defs>
  <text x="40" y="42" class="title">Before: decisions and effects share two giant methods</text>
  <rect x="55" y="90" width="390" height="320" rx="18" class="runtime"/>
  <text x="85" y="126" class="label">LocalConsoleRuntime</text>
  <text x="85" y="162" class="label">processPending (~930 lines)</text>
  <text x="105" y="190" class="body">routing · lane · resume · prompt</text>
  <text x="105" y="214" class="body">claim · store writes · provider callbacks</text>
  <text x="85" y="260" class="label">runWorker (~700 lines)</text>
  <text x="105" y="288" class="body">lane · resume · prompt · attachments</text>
  <text x="105" y="312" class="body">detached writes · provider · lifecycle</text>
  <text x="85" y="362" class="body">Decision tests require runtime + SQLite</text>
  <rect x="565" y="90" width="350" height="72" rx="14" class="io"/>
  <rect x="565" y="196" width="350" height="72" rx="14" class="io"/>
  <rect x="565" y="302" width="350" height="72" rx="14" class="io"/>
  <text x="595" y="133" class="label">SQLite / session JSONL</text>
  <text x="595" y="239" class="label">Workspace / attachments / files</text>
  <text x="595" y="345" class="label">Codex / Claude / Kimi drivers</text>
  <line x1="445" y1="165" x2="565" y2="126" class="arrow"/>
  <line x1="445" y1="245" x2="565" y2="232" class="arrow"/>
  <line x1="445" y1="325" x2="565" y2="338" class="arrow"/>
</svg>

