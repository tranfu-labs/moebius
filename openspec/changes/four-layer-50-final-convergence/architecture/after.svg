<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
  <title id="title">Moebius four-layer architecture after final convergence</title>
  <desc id="desc">Every production file has one enforced layer, static interface copy is localized, and final evidence is reproducible.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #172033; }
    .title { font-size: 24px; font-weight: 700; }
    .label { font-size: 17px; font-weight: 650; }
    .body { font-size: 14px; }
    .view { fill: #f7efff; stroke: #8a53b6; stroke-width: 2; }
    .app { fill: #fff1df; stroke: #d27b22; stroke-width: 2; }
    .domain { fill: #eaf8ee; stroke: #2f8a4d; stroke-width: 2; }
    .adapter { fill: #eaf2ff; stroke: #4076b8; stroke-width: 2; }
    .gate { fill: #f1f3f6; stroke: #536174; stroke-width: 2; }
    .arrow { stroke: #536174; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536174"/></marker></defs>
  <text x="42" y="46" class="title">After: enforced layers, localized copy, reproducible evidence</text>
  <rect x="55" y="100" width="225" height="145" rx="18" class="view"/>
  <text x="80" y="138" class="label">View</text>
  <text x="80" y="172" class="body">state → pixels</text>
  <text x="80" y="199" class="body">translation keys only</text>
  <text x="80" y="226" class="body">intent outward</text>
  <rect x="325" y="100" width="225" height="145" rx="18" class="app"/>
  <text x="350" y="138" class="label">Application</text>
  <text x="350" y="172" class="body">use-case orchestration</text>
  <text x="350" y="199" class="body">latest-locale commit</text>
  <text x="350" y="226" class="body">narrow ports</text>
  <rect x="595" y="100" width="225" height="145" rx="18" class="domain"/>
  <text x="620" y="138" class="label">Domain</text>
  <text x="620" y="172" class="body">plain-value decisions</text>
  <text x="620" y="199" class="body">transitive pure closure</text>
  <text x="620" y="226" class="body">deterministic tests</text>
  <rect x="865" y="100" width="225" height="145" rx="18" class="adapter"/>
  <text x="890" y="138" class="label">Adapters</text>
  <text x="890" y="172" class="body">fs · SQLite · provider</text>
  <text x="890" y="199" class="body">HTTP · IPC · browser</text>
  <text x="890" y="226" class="body">stable external failures</text>
  <line x1="280" y1="173" x2="325" y2="173" class="arrow"/>
  <line x1="550" y1="173" x2="595" y2="173" class="arrow"/>
  <line x1="820" y1="173" x2="865" y2="173" class="arrow"/>
  <rect x="120" y="330" width="880" height="210" rx="20" class="gate"/>
  <text x="155" y="372" class="label">Final convergence evidence</text>
  <text x="155" y="408" class="body">exactly-one assignment · zero legacy debt · exact roots · stale permit rejection</text>
  <text x="155" y="438" class="body">IB/NI oracle ledger · six-batch test ledger · preserved real-I/O seams</text>
  <text x="155" y="468" class="body">zh-CN/en resource parity · zero production CJK fallback · no locale branches</text>
  <text x="155" y="498" class="body">RA-16 · one full gate · fixed-rubric purity and I/O timing report</text>
  <line x1="560" y1="330" x2="560" y2="245" class="arrow"/>
  <text x="355" y="600" class="body">Final machine counts are written after implementation and before fact-source return.</text>
</svg>
