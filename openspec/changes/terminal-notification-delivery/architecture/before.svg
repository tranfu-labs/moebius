<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="Inter, sans-serif" font-size="12">
  <rect width="720" height="420" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#111">现状：结束信号从队列瞬时状态推断，无出屏通道</text>

  <rect x="40" y="70" width="200" height="56" rx="10" fill="#f2f2f2" stroke="#999"/>
  <text x="140" y="94" text-anchor="middle" font-weight="600" fill="#111">主理人 run 终局</text>
  <text x="140" y="112" text-anchor="middle" fill="#555">成员交棒/队列缝隙</text>

  <rect x="300" y="70" width="200" height="56" rx="10" fill="#f2f2f2" stroke="#999"/>
  <text x="400" y="94" text-anchor="middle" font-weight="600" fill="#111">队列瞬时状态</text>
  <text x="400" y="112" text-anchor="middle" fill="#555">空队列 → 推断「结束」</text>

  <rect x="560" y="70" width="120" height="56" rx="10" fill="#f2f2f2" stroke="#999"/>
  <text x="620" y="94" text-anchor="middle" font-weight="600" fill="#111">侧边栏点</text>
  <text x="620" y="112" text-anchor="middle" fill="#c00">抖动</text>

  <line x1="240" y1="98" x2="298" y2="98" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="98" x2="558" y2="98" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="170" width="200" height="56" rx="10" fill="#f2f2f2" stroke="#999"/>
  <text x="140" y="194" text-anchor="middle" font-weight="600" fill="#111">终局事实</text>
  <text x="140" y="212" text-anchor="middle" fill="#555">未落盘（PRD 缺口）</text>

  <rect x="300" y="170" width="200" height="56" rx="10" fill="#f2f2f2" stroke="#999"/>
  <text x="400" y="194" text-anchor="middle" font-weight="600" fill="#111">系统通知 / Dock / 声音</text>
  <text x="400" y="212" text-anchor="middle" fill="#c00">无实现</text>

  <line x1="240" y1="198" x2="298" y2="198" stroke="#c00" stroke-width="1.5" stroke-dasharray="4 3"/>

  <rect x="40" y="280" width="200" height="56" rx="10" fill="#f2f2f2" stroke="#999"/>
  <text x="140" y="304" text-anchor="middle" font-weight="600" fill="#111">权限检查</text>
  <text x="140" y="322" text-anchor="middle" fill="#c00">无（每次发送前）</text>

  <rect x="300" y="280" width="200" height="56" rx="10" fill="#f2f2f2" stroke="#999"/>
  <text x="400" y="304" text-anchor="middle" font-weight="600" fill="#111">点击回流</text>
  <text x="400" y="322" text-anchor="middle" fill="#c00">无（含退出后启动）</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999"/>
    </marker>
  </defs>
</svg>
