<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">控制台错误所有权改造后</title>
  <desc id="desc">每个用例以来源和操作代次发布或消解错误，纯 reducer 拒绝跨来源清除和迟到结果，页面仍显示一个当前错误。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  </defs>
  <rect width="960" height="460" fill="#f8fafc"/>
  <text x="40" y="42" font-family="system-ui" font-size="24" font-weight="700" fill="#0f172a">After · 来源所有权 + 操作代次</text>
  <g font-family="system-ui" font-size="16" fill="#0f172a">
    <rect x="45" y="90" width="255" height="72" rx="10" fill="#fff" stroke="#94a3b8"/><text x="70" y="120">用户用例</text><text x="70" y="145">begin / fail / succeed(source)</text>
    <rect x="45" y="200" width="255" height="72" rx="10" fill="#fff" stroke="#94a3b8"/><text x="70" y="230">state refresh</text><text x="70" y="255">只 settle state-refresh token</text>
    <rect x="45" y="310" width="255" height="72" rx="10" fill="#fff" stroke="#94a3b8"/><text x="70" y="340">并发实体</text><text x="70" y="365">family + draft/session scope</text>
    <rect x="390" y="125" width="260" height="190" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="425" y="165" font-weight="700">domain reducer</text>
    <text x="420" y="200">每个 source 一条未解决错误</text>
    <text x="420" y="230">跨来源 succeed → no-op</text>
    <text x="420" y="260">stale token → no-op</text>
    <text x="420" y="290">同源 clear → 回显剩余最新项</text>
    <rect x="745" y="165" width="175" height="110" rx="10" fill="#fff" stroke="#94a3b8"/>
    <text x="775" y="205">visibleMessage</text><text x="770" y="235">单一现有表面</text><text x="770" y="260">UI 布局不变</text>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
    <path d="M300 126 L390 170"/><path d="M300 236 L390 220"/><path d="M300 346 L390 275"/><path d="M650 220 L745 220"/>
  </g>
  <text x="390" y="370" font-family="system-ui" font-size="16" fill="#166534">只有产生错误的当前操作能够消解它</text>
</svg>
